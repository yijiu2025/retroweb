<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RetroWeb · 逆合成工作台</title>
    <meta name="description" content="逆合成路线规划工作台：一行一化合物，多次一步交互式拆分" />
    <!--
      内联 SVG 图标：省掉一次 /favicon.ico 404，也不用多一个文件 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='9' r='4' fill='%232563eb'/%3E%3Ccircle cx='23' cy='13' r='4' fill='%23059669'/%3E%3Ccircle cx='13' cy='23' r='4' fill='%23dc2626'/%3E%3C/svg%3E"
    />

    <!--
      主题预置：**必须在第一次 paint 之前**给 <html> 打上 dark 类，否则深色用户每次刷新都闪一帧白。

      🔴 为什么非得在 HTML 里做：`settings` store 是在 `AppShell` 的 setup() 里才首次实例化的
         （main.ts / bootstrap.ts / App.vue / router 都没碰它），而挂载还要等
         `router.isReady()`。也就是说 `html.dark` 会**晚于首屏 paint** 才落下 ⇒ 白闪。
         这个脚本在样式与模块脚本之前同步执行，正好赶上首次绘制。

      🔴 判定口径**必须与 `src/stores/settings.ts` 的 `readInitial()` 逐字一致**：
           · key是 `retroweb_theme`，值是 **'dark' / 'light'**（不是其他偏好用的 '1' / '0'）
           · 读不到 / 值不认识 ⇒ 回落 `prefers-color-scheme`
         两处一旦不一致，store 初始化时会算出相反值再把 class 改回去 ⇒ 闪一下更严重。
         🔴 改 key 名或取值口径时，**index.html 与 settings.ts 必须同改**。

      `data-theme` 目前没有 CSS 消费者（只有 settings 的 apply() 在写），这里照样写上，
      保持与 `apply()` 的最终状态一致 —— 免得将来加了消费者，两条路的初始值不一样。
    -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('retroweb_theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          /* 隐私模式下 localStorage 会抛；主题退回默认（浅色）即可，不阻断首屏 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      Ketcher（ketcher-react）的依赖链里混着三个 browserify 时代的 Node 垫片：
      `setimmediate` / `util` / `inherits`。它们**假定全局存在 `global` 和 `process`**
      （`setimmediate` 里直接写 `global.postMessage`、`process.nextTick`）。
      浏览器没有这两个全局量 ⇒ 一 import Ketcher 就是 "global is not defined"。
      Vite 只会把 `process.env.NODE_ENV` 这**一个**表达式替换掉，不会替你造全局对象，
      所以必须在这里垫。
      ⚠️ 顺序：必须在任何 module 脚本之前执行（普通 <script> 天然早于 type="module"）。
    -->
    <script>
      window.global = window.global || window;
      window.process = window.process || {
        env: {},
        nextTick: function (fn) {
          const args = Array.prototype.slice.call(arguments, 1);
          setTimeout(function () {
            fn.apply(null, args);
          }, 0);
        }
      };
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
