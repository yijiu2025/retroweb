name: 功能建议
description: 提一个新功能或改进建议
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景问题
      description: 你想解决什么问题？没有这个功能时现在怎么绕？
      placeholder: |
        例：路线很深时方案对照要反复横滚，希望树面板可折叠成只显示深度层。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你期望的交互 / 配置长什么样
      placeholder: |
        例：路线树工具栏加「按深度折叠」，记住每个方案的折叠状态。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的其他做法，以及为什么更差
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影响面
      options:
        - 路线树 / 候选前体
        - 多方案对照
        - 结构式画板 / 分子渲染
        - 登录 / SSO 集成
        - LLM 工艺分析
        - 运行设置 / 个人中心
        - 构建 / CI / 依赖
        - 文档
        - 其他
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: 是否需要后端配合
      description: 纯前端可完成的改动排期快；需要 retro 配合的要跨仓协调
      options:
        - 不需要，纯前端
        - 需要 retro 新增 / 调整接口
        - 需要 oauth21 配合
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 附加材料
      description: 参考设计、竞品截图、相关 issue / PR 链接
    validations:
      required: false
